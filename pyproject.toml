[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colhash"
version = "0.1.0"
description = "Did my pipeline change the output? Per-column parquet hashing, diffs, and a noise band for non-deterministic pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kav Ohiomoba" }]
keywords = ["parquet", "data-quality", "regression-testing", "pipelines", "determinism", "pyarrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pyarrow>=14", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/cvbourne/colhash"
Issues = "https://github.com/cvbourne/colhash/issues"

[project.scripts]
colhash = "colhash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colhash"]

[tool.hatch.build.targets.sdist]
include = ["src/colhash", "tests", "examples/make_example.py", "benchmarks", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
